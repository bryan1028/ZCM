[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Secret scanning stays ON so the build fails if ADMIN_PASSWORD or the Firebase key ever leak into shipped code.
  # The public site URL is meant to appear in pages, so it is exempt.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL"
